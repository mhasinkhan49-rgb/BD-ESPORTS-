function render(){

  if(!q) return catOk;
  // বাংলা + ইংলিশ দুইটাই সার্চ হবে
  let name=p.name.toLowerCase();
  if(name.includes(q)) return catOk;
  if(q.includes('লোশন') && name.includes('lotion')) return catOk;
  if(q.includes('কসমেটিক') && (p.cat=='beauty'||p.cat=='korean')) return catOk;
  if(q.includes('গান') && p.cat=='gun') return catOk;
  if(q.includes('খেলনা') && p.cat=='toy') return catOk;
  if(q.includes('ড্রোন') && p.cat=='drone') return catOk;
  if(q.includes('কোরিয়ান') && p.cat=='korean') return catOk;
  if(q.includes('ট্রিমার') && name.includes('trimmer')) return catOk;
  if(q.includes('ইয়ারফোন') && name.includes('earphone')) return catOk;
  if(q.includes('ড্রেস') && p.cat=='fashion') return catOk;
  if(q.includes('জামা') && p.cat=='fashion') return catOk;
  return false;
 });
 document.getElementById('resultCount').innerText=list.length+" টা পাওয়া গেছে"+(q? " - '"+q+"' এর জন্য":"");
 document.getElementById('grid').innerHTML=list.map(p=>{let i=products.indexOf(p); return `<div class="card" onclick="openDetail(${i})"><img src="${p.img}"><div class="tag"><span class="g">FREE DELIVERY</span><span class="p">VOUCHER MAX</span></div><h4>${p.name}</h4><div class="price">৳ ${p.price} <span class="old">৳${p.old}</span> <span class="off">-${p.off}%</span> <span class="sold">${p.sold}</span></div><div class="rate">⭐ ${p.rate} | 📍 ${p.loc}</div><button class="buy" onclick="event.stopPropagation();buyNow(${i})">⚡ Buy Now</button><button class="add" onclick="event.stopPropagation();addCart(${i})">🛒 Add to Cart</button></div>`}).join("") || "<p style='padding:20px;text-align:center'>এই নামে কিছু পাওয়া যায় নাই। অন্য নাম লিখো। যেমন: lotion, trimmer, drone</p>";
