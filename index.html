<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Soccer 2026</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: sans-serif; }
        body { background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 100vw; max-width: 420px; height: 100vh; max-height: 750px; background: #2e7d32; display: flex; flex-direction: column; border: 2px solid #444; }
        .header { background: rgba(0,0,0,0.8); padding: 10px; display: flex; justify-content: space-between; align-items: center; z-index: 10; font-size: 14px; font-weight: bold; }
        .scoreboard { background: rgba(0,0,0,0.5); padding: 5px 12px; border-radius: 15px; border: 1px solid #777; }
        .tokens { background: rgba(255,193,7,0.2); border: 1px solid #ffc107; color: #ffc107; padding: 4px 10px; border-radius: 15px; }
        .stadium { position: relative; flex: 1; display: flex; justify-content: center; align-items: center; background: #388e3c; overflow: hidden; }
        canvas { background: #4caf50; display: block; }
        .controls { height: 160px; background: rgba(0,0,0,0.7); display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; z-index: 10; }
        .d-pad { position: relative; width: 110px; height: 110px; }
        .d-btn { position: absolute; width: 36px; height: 36px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); border-radius: 50%; color: white; display: flex; justify-content: center; align-items: center; }
        .d-up { top: 0; left: 37px; } .d-down { bottom: 0; left: 37px; } .d-left { top: 37px; left: 0; } .d-right { top: 37px; right: 0; }
        .action-btns { display: flex; gap: 10px; }
        .btn { width: 55px; height: 55px; border-radius: 50%; border: 2px solid #fff; color: white; font-weight: bold; font-size: 11px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .btn-pass { background: #1976d2; } .btn-sprint { background: #388e3c; } .btn-shoot { background: #d32f2f; }
        .shop-btn { position: absolute; top: 50px; right: 10px; background: #ffb300; color: #000; border: none; padding: 5px 10px; border-radius: 12px; font-weight: bold; cursor: pointer; z-index: 10; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; padding: 20px; text-align: center; }
        .card { background: #222; border: 1px solid #444; border-radius: 8px; padding: 10px; margin: 8px 0; width: 80%; display: flex; justify-content: space-between; align-items: center; }
        .buy-btn { background: #ffc107; color: #000; border: none; padding: 6px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .buy-btn:disabled { background: #555; color: #888; }
        .close-btn { margin-top: 15px; background: #d32f2f; color: white; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header">
        <div class="scoreboard">YOU <span id="score-user">0</span> - <span id="score-bot">0</span> BOT <span id="timer" style="color:#ffeb3b; margin-left:10px;">01:00</span></div>
        <div class="tokens">🪙 <span id="token-count">0</span></div>
    </div>

    <button class="shop-btn" onclick="openShop()">🛒 শপ</button>

    <div class="stadium">
        <canvas id="fieldCanvas" width="360" height="480"></canvas>
    </div>

    <div class="controls">
        <div class="d-pad">
            <div class="d-btn d-up" id="btn-up">▲</div>
            <div class="d-btn d-left" id="btn-left">◀</div>
            <div class="d-btn d-right" id="btn-right">▶</div>
            <div class="d-btn d-down" id="btn-down">▼</div>
        </div>
        <div class="action-btns">
            <div class="btn btn-pass" id="btn-pass">PASS</div>
            <div class="btn btn-sprint" id="btn-sprint">SPRINT</div>
            <div class="btn btn-shoot" id="btn-shoot">SHOOT</div>
        </div>
    </div>

    <div id="shop-modal" class="overlay hidden">
        <h2>ক্যারেক্টার শপ</h2>
        <p style="font-size: 12px; color: #aaa; margin-bottom: 15px;">১০,০০০ টোকেন দিয়ে প্লেয়ার কিনুন</p>
        <div class="card">
            <div style="text-align:left;"><strong style="color:#ff4081;">লি (Lee)</strong><div style="font-size:11px; color:#ccc;">স্পিড: +৩৫%</div></div>
            <button class="buy-btn" id="buy-lee" onclick="buyChar('Lee')">১০,০০০ 🪙</button>
        </div>
        <div class="card">
            <div style="text-align:left;"><strong style="color:#00e676;">আফা (Afa)</strong><div style="font-size:11px; color:#ccc;">পাওয়ার: +৫০%</div></div>
            <button class="buy-btn" id="buy-afa" onclick="buyChar('Afa')">১০,০০০ 🪙</button>
        </div>
        <div class="card">
            <div style="text-align:left;"><strong style="color:#00b0ff;">ফিফা (Fifa)</strong><div style="font-size:11px; color:#ccc;">মাস্টার স্ট্যাটস</div></div>
            <button class="buy-btn" id="buy-fifa" onclick="buyChar('Fifa')">১০,০০০ 🪙</button>
        </div>
        <button class="close-btn" onclick="closeShop()">বন্ধ করুন</button>
    </div>

    <div id="end-modal" class="overlay hidden">
        <h1 id="match-result">ম্যাচ সমাপ্ত!</h1>
        <p id="reward-text" style="margin: 15px 0; color: #ffc107; font-size: 16px;"></p>
        <button class="buy-btn" style="padding: 10px 20px;" onclick="restartMatch()">আবার খেলুন</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('fieldCanvas');
    const ctx = canvas.getContext('2d');

    let tokens = parseInt(localStorage.getItem('game_tokens') || '0');
    let unlockedChars = JSON.parse(localStorage.getItem('unlocked_chars') || '[]');
    let selectedChar = localStorage.getItem('selected_char') || 'Normal';

    let userScore = 0, botScore = 0, matchTime = 60;
    let gameInterval, timerInterval;
    let keys = { up: false, down: false, left: false, right: false, sprint: false };
    document.getElementById('token-count').innerText = tokens;

    class Ball {
        constructor(x, y) {
            this.x = x; this.y = y; this.vx = 0; this.vy = 0; this.radius = 5; this.friction = 0.97; this.owner = null;
        }
        update() {
            if (this.owner) {
                this.x = this.owner.x + Math.cos(this.owner.angle) * 12;
                this.y = this.owner.y + Math.sin(this.owner.angle) * 12;
                this.vx = 0; this.vy = 0;
            } else {
                this.x += this.vx; this.y += this.vy;
                this.vx *= this.friction; this.vy *= this.friction;
                if(this.x < 12) { this.x = 12; this.vx *= -0.6; }
                if(this.x > canvas.width - 12) { this.x = canvas.width - 12; this.vx *= -0.6; }
                
                if(this.y < 12) {
                    if(this.x > 110 && this.x < 250) { userScore++; document.getElementById('score-user').innerText = userScore; resetPos(); }
                    else { this.y = 12; this.vy *= -0.6; }
                }
                if(this.y > canvas.height - 12) {
                    if(this.x > 110 && this.x < 250) { botScore++; document.getElementById('score-bot').innerText = botScore; resetPos(); }
                    else { this.y = canvas.height - 12; this.vy *= -0.6; }
                }
            }
        }
        draw() {
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke(); ctx.closePath();
        }
    }

    class Player {
        constructor(x, y, team, num, isGK = false, isMain = false) {
            this.startX = x; this.startY = y; this.x = x; this.y = y;
            this.team = team; this.num = num; this.isGK = isGK; this.isMain = isMain;
            this.radius = 10; this.speed = isGK ? 2.0 : 2.5; this.angle = 0;
        }
        update() {
            let speedMult = 1;
            if(this.isMain) {
                if(selectedChar === 'Lee') speedMult = 1.35;
                if(selectedChar === 'Fifa') speedMult = 1.45;
            }
            if (this.isMain) {
                let dx = 0, dy = 0;
                if (keys.up) dy -= 1; if (keys.down) dy += 1; if (keys.left) dx -= 1; if (keys.right) dx += 1;
                if (dx !== 0 || dy !== 0) {
                    this.angle = Math.atan2(dy, dx);
                    let curSpeed = this.speed * speedMult * (keys.sprint ? 1.5 : 1);
                    this.x += Math.cos(this.angle) * curSpeed; this.y += Math.sin(this.angle) * curSpeed;
                }
            } else if (this.isGK) {
                this.x += (ball.x - this.x) * 0.1;
                this.x = Math.max(120, Math.min(240, this.x));
            } else {
                if (this.team === 'bot') {
                    if (ball.owner === this) {
                        this.angle = Math.atan2(10 - this.y, 180 - this.x);
                        this.x += Math.cos(this.angle) * (this.speed * 1.1);
                        this.y += Math.sin(this.angle) * (this.speed * 1.1);
                        if(this.y < 140) shoot(this, 0, -1);
                    } else {
                        this.angle = Math.atan2(ball.y - this.y, ball.x - this.x);
                        this.x += Math.cos(this.angle) * (this.speed * 1.05);
                        this.y += Math.sin(this.angle) * (this.speed * 1.05);
                    }
                } else {
                    if (!this.isMain && ball.owner !== this) {
                        this.y += (this.startY - this.y) * 0.04;
                    }
                }
            }
            this.x = Math.max(14, Math.min(canvas.width - 14, this.x));
            this.y = Math.max(14, Math.min(canvas.height - 14, this.y));

            if (Math.hypot(ball.x - this.x, ball.y - this.y) < this.radius + ball.radius + 2) {
                ball.owner = this;
            }
        }
        draw() {
            ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.isGK ? '#ff9800' : (this.team === 'user' ? '#1e88e5' : '#e53935');
            ctx.fill(); ctx.strokeStyle = this.isMain ? '#ffeb3b' : '#fff'; ctx.lineWidth = this.isMain ? 3 : 1; ctx.stroke(); ctx.closePath();
            
            ctx.fillStyle = '#fff'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(this.num, this.x, this.y);
        }
    }

    let players = [], ball = new Ball(180, 240);

    function init() {
        players = [
            new Player(180, 40, 'user', '1', true),
            new Player(180, 320, 'user', '10', false, true),
            new Player(90, 260, 'user', '7', false),
            new Player(270, 260, 'user', '9', false),
            new Player(180, 440, 'bot', '1', true),
            new Player(180, 160, 'bot', '10', false),
            new Player(90, 200, 'bot', '11', false),
            new Player(270, 200, 'bot', '8', false)
        ];
    }

    function resetPos() {
        ball.owner = null; ball.x = 180; ball.y = 240; ball.vx = 0; ball.vy = 0;
        players.forEach(p => { p.x = p.startX; p.y = p.startY; });
    }

    function pass() {
        let main = players.find(p => p.isMain);
        if (ball.owner === main) {
            let teammates = players.filter(p => p.team === 'user' && !p.isMain);
            let closest = teammates.reduce((prev, curr) => Math.hypot(curr.x - main.x, curr.y - main.y) < Math.hypot(prev.x - main.x, prev.y - main.y) ? curr : teammates[0]);
            ball.owner = null;
            let angle = Math.atan2(closest.y - main.y, closest.x - main.x);
            ball.vx = Math.cos(angle) * 8; ball.vy = Math.sin(angle) * 8;
        }
    }

    function shoot(shooter = null, dx = 0, dy = -1) {
        let p = shooter || players.find(p => p.isMain);
        if (ball.owner === p) {
            ball.owner = null;
            let power = (p.isMain && (selectedChar === 'Afa' || selectedChar === 'Fifa')) ? 14 : 10;
            if(!shooter) {
                let angle = Math.atan2(0 - p.y, 180 - p.x);
                ball.vx = Math.cos(angle) * power; ball.vy = Math.sin(angle) * power;
            } else {
                ball.vx = dx * power; ball.vy = dy * power;
            }
        }
    }

    function loop() {
        ctx.fillStyle = '#4caf50'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);
        ctx.beginPath(); ctx.moveTo(10, canvas.height / 2); ctx.lineTo(canvas.width - 10, canvas.height / 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, 40, 0, Math.PI * 2); ctx.stroke();
        
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(110, 2, 140, 10); ctx.fillRect(110, canvas.height - 12, 140, 10);

        players.forEach(p => { p.update(); p.draw(); });
        ball.update(); ball.draw();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            matchTime--;
            let m = Math.floor(matchTime / 60), s = matchTime % 60;
            document.getElementById('timer').innerText = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
            if (matchTime <= 0) {
                clearInterval(gameInterval); clearInterval(timerInterval);
                let text = userScore > botScore ? "🎉 আপনি জিতেছেন! +৫০০ টোকেন" : "❌ আপনি হেরে গেছেন!";
                if(userScore > botScore) { tokens += 500; localStorage.setItem('game_tokens', tokens); }
                document.getElementById('token-count').innerText = tokens;
                document.getElementById('match-result').innerText = text;
                document.getElementById('end-modal').classList.remove('hidden');
            }
        }, 1000);
    }

    function restartMatch() {
        userScore = 0; botScore = 0; matchTime = 60;
        document.getElementById('score-user').innerText = '0';
        document.getElementById('score-bot').innerText = '0';
        document.getElementById('end-modal').classList.add('hidden');
        resetPos();
        gameInterval = setInterval(loop, 1000 / 60);
        startTimer();
    }

    function openShop() { updateShop(); document.getElementById('shop-modal').classList.remove('hidden'); }
    function closeShop() { document.getElementById('shop-modal').classList.add('hidden'); }

    function updateShop() {
        ['Lee', 'Afa', 'Fifa'].forEach(name => {
            let btn = document.getElementById(`buy-${name.toLowerCase()}`);
            if (unlockedChars.includes(name)) {
                btn.innerText = selectedChar === name ? "সিলেক্টেed" : "সিলেক্ট";
                btn.disabled = selectedChar === name;
                btn.onclick = () => { selectedChar = name; localStorage.setItem('selected_char', name); updateShop(); };
            } else {
                btn.innerText = "১০,০০০ 🪙";
                btn.disabled = tokens < 10000;
            }
        });
    }

    function buyChar(name) {
        if (tokens >= 10000 && !unlockedChars.includes(name)) {
            tokens -= 10000; unlockedChars.push(name); selectedChar = name;
            localStorage.setItem('game_tokens', tokens);
            localStorage.setItem('unlocked_chars', JSON.stringify(unlockedChars));
            localStorage.setItem('selected_char', selectedChar);
            document.getElementById('token-count').innerText = tokens;
            updateShop();
        }
    }

    function bind(id, prop) {
        let el = document.getElementById(id);
        el.addEventListener('touchstart', e => { e.preventDefault(); keys[prop] = true; });
        el.addEventListener('touchend', e => { e.preventDefault(); keys[prop] = false; });
        el.addEventListener('mousedown', () => keys[prop] = true);
        el.addEventListener('mouseup', () => keys[prop] = false);
    }
    bind('btn-up', 'up'); bind('btn-down', 'down'); bind('btn-left', 'left'); bind('btn-right', 'right'); bind('btn-sprint', 'sprint');
    
    document.getElementById('btn-pass').addEventListener('click', pass);
    document.getElementById('btn-shoot').addEventListener('click', () => shoot());

    init();
    gameInterval = setInterval(loop, 1000 / 60);
    startTimer();
</script>
</body>
</html>
