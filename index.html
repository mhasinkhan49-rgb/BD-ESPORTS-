<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - হ্যালো বাংলাদেশ</title>
<style>
body{background:#000;color:#FFD700;font-family:Arial;text-align:center;padding:20px}
input,button{padding:12px;margin:8px;border-radius:8px;border:none;font-size:16px}
button{background:#FFD700;color:#000;font-weight:bold;cursor:pointer}
.card{background:#111;border:1px solid #FFD700;padding:15px;margin:10px auto;border-radius:12px;max-width:500px;text-align:left}
.pending{border-left:5px solid orange}
.approved{border-left:5px solid #00ff00}
.rejected{border-left:5px solid red}
</style>
</head>
<body>
<h1>👑 Admin Panel - হ্যালো বাংলাদেশ</h1>

<div id="loginBox">
<input type="password" id="pass" placeholder="Password লিখো: admin123" style="width:80%;max-width:300px">
<br>
<button onclick="login()">Login</button>
<p id="msg" style="color:red"></p>
</div>

<div id="panel" style="display:none">
<h2>💰 Add Money Requests</h2>
<div id="list"></div>
<button onclick="clearAll()" style="background:red;color:white;margin-top:20px">সব Delete করো</button>
</div>

<script>
function login(){
  let p = document.getElementById('pass').value.trim();
  if(p === 'admin123'){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('panel').style.display='block';
    loadRequests();
  } else {
    document.getElementById('msg').innerText = 'ভুল! আবার লিখো: admin123 (ছোট হাতের)';
  }
}

function loadRequests(){
  let reqs = JSON.parse(localStorage.getItem('hb_requests')||'[]');
  let html = '';
  if(reqs.length==0){ html='<p>কোনো Request নেই</p>'; }
  reqs.reverse().forEach((r,i)=>{
    let realIndex = reqs.length-1-i;
    html+=`<div class="card ${r.status=='Pending'?'pending':r.status=='Approved'?'approved':'rejected'}">
      <b>💰 ${r.amount} Taka</b>
