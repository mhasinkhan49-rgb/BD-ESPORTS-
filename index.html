<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BD FOOTBALL - Full Court</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#06130a;color:#fff;font-family:sans-serif;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;padding:8px 10px;background:#000}
.logo{font-weight:900;color:#00ff88}
.pill{background:#1a2a1a;border:1px solid #00ff88;padding:5px 10px;border-radius:20px;font-size:13px}
.screen{position:fixed;inset:0;display:none;overflow:auto;padding:58px 12px 20px;background:#0a2a12}
.screen.active{display:block}
.card{background:#122a18;border:1px solid #2a5a35;border-radius:14px;padding:14px;margin:10px 0}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:#00e676;color:#000;font-weight:900;margin:6px 0}
.btn2{background:linear-gradient(90deg,#ffd700,#ff9800)}
.btn3{background:#222;color:#fff;border:1px solid #444}
input{width:100%;padding:11px;border-radius:10px;border:0;background:#1e3a26;color:#fff;margin:6px 0}
#gameWrap{position:fixed;inset:0;display:none;background:#2e9e4f;z-index:30}
canvas{width:100vw;height:100vh;display:block}
.joy{position:absolute;left:14px;bottom:14px;width:110px;height:110px;border-radius:50%;background:rgba(0,0,0,.4);border:2px solid #fff;z-index:40}
.knob{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:#fff}
.gbtn{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:40}
.gbtn button{width:68px;height:68px;border-radius:50%;border:2px solid #fff;font-weight:900;color:#fff}
.score{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:6px 12px;border-radius:20px;font-weight:900;z-index:40;white-space:nowrap;font-size:13px}
.popup{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.92);border:3px solid #ffd700;padding:12px 18px;border-radius:14px;font-size:22px;font-weight:900;z-index:50;display:none;text-align:center}
#adminDot{position:fixed;right:6px;bottom:6px;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #ffd700;z-index:100}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:99;padding:14px}
.modal.open{display:flex}.box{background:#122a18;width:100%;max-width:400px;border-radius:14px;padding:14px}
</style></head><body>

<div class="top"><div class="logo">BD ⚽ FOOTBALL</div><div class="pill">💎 <span id="diam">500</span></div></div>

<div id="scr-login" class="screen active"><div class="card" style="text-align:center"><h2>🏆 BD FOOTBALL</h2><p>Full Court • 6v6 • Real GK • Trophy</p><p style="font-size:12px;color:#ffd700">📱 মোবাইল বাঁকা করো → পুরা কোর্ট দেখবা</p><input id="loginName" placeholder="নাম"><input id="loginGmail" placeholder="Gmail"><button class="btn" onclick="doLogin()">LOGIN → খেলো</button></div></div>

<div id="scr-home" class="screen"><div class="card"><h3>👋 <span id="hiName">Player</span> | Team: <b id="myTeam">বাংলাদেশ</b></h3><button class="btn" onclick="startGame()">▶️ PLAY - 6 VS 6</button><button class="btn btn2" onclick="startGame()">🏆 WORLD CUP</button><button class="btn" onclick="show('scr-store')">🛍️ STORE</button><button class="btn" onclick="show('scr-luck')">🎡 LUCK ROYAL</button></div><div class="card"><h3>⭐ Character</h3><div id="chars"></div></div></div>

<div id="scr-store" class="screen"><div class="card"><h3>🛍️ STORE</h3><div id="store"></div><button class="btn btn2" onclick="earnDiamond(500)">Daily +500 💎</button><button class="btn btn3" onclick="show('scr-home')">← Back</button></div></div>

<div id="scr-luck" class="screen"><div class="card" style="text-align:center"><h3>🎡 LUCK ROYAL</h3><div id="wheel" style="width:140px;height:140px;border-radius:50%;border:6px solid #ffd700;margin:10px auto;display:flex;align-items:center;justify-content:center;font-size:28px;background:conic-gradient(#ff1744 0 45deg,#ffd700 45deg 90deg,#00e676 90deg 135deg,#1e88e5 135deg 180deg,#9c27b0 180deg 225deg,#ff9800 225deg 270deg,#00bcd4 270deg 315deg,#76ff03 315deg 360deg);transition:transform 2s">🎁</div><button class="btn btn2" onclick="spin()">SPIN - 50 💎</button><p id="spinMsg" style="color:#ffd700"></p></div><button class="btn btn3" onclick="show('scr-home')">← Back</button></div>

<div id="gameWrap"><canvas id="cv"></canvas><div class="score" id="score">BD 0-0 OPP</div><div class="popup" id="popup">GOAL!</div><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="gbtn"><button style="background:#e53935" onclick="doShoot()">SHOOT</button><button style="background:#1e88e5" onclick="doPass()">PASS</button><button style="background:#ff9800" onclick="doThrough()">THROUGH</button><button style="background:#00c853" onclick="doSprint()">SPRINT</button></div><button onclick="exitGame()" style="position:absolute;top:8px;left:8px;padding:8px 12px;border-radius:20px;border:0;background:#000;color:#fff;z-index:40">✕ EXIT</button></div>

<div id="adminDot" onclick="openAdmin()"></div>
<div id="adminModal" class="modal"><div class="box"><h3>🔐 Admin</h3><input id="adminPass" type="password" placeholder="admin123"><button class="btn" onclick="adminLogin()">Login</button><div id="adminBody" style="display:none"><input id="newCharName" placeholder="নতুন Character / Jersey নাম"><button class="btn" onclick="addChar()">+ ADD করো</button><p id="adminMsg" style="color:#00ff88"></p><input id="newPass" placeholder="নতুন Password"><button class="btn btn3" onclick="changePass()">Password Change</button></div><button class="btn btn3" onclick="closeAdmin()">Close</button></div></div>

<script>
let S=JSON.parse(localStorage.getItem('bdfull')||'{}');
let diamonds=S.diamonds??500,myTeam="বাংলাদেশ",myChar="Bangladesh 8",adminPass=S.adminPass||'admin123';
let chars=S.chars||[["Bangladesh 8","🇧🇩"],["Portugal 7","🇵🇹"],["Argentina 10","🇦🇷"],["France 10","🇫🇷"]];
let storeItems=S.store||[["Bangladesh Jersey","150 💎"],["Pro Pant","120 💎"],["Pro Boots","130 💎"],["Golden Ball","180 💎"]];
function save(){localStorage.setItem('bdfull',JSON.stringify({diamonds,adminPass,chars,storeItems}))}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function doLogin(){let n=document.getElementById('loginName').value.trim(),g=document.getElementById('loginGmail').value.trim();if(!n||!g.includes('@')){alert('নাম + Gmail দাও');return}document.getElementById('hiName').innerText=n;show('scr-home')}
function renderChars(){document.getElementById('chars').innerHTML=chars.map(c=>`<button class="btn btn3" onclick="pickChar('${c[0]}')">${c[1]} ${c[0]}</button>`).join('')}
function pickChar(c){myChar=c;alert(c+' Select হইছে!')}
function renderStore(){document.getElementById('store').innerHTML=storeItems.map(s=>`<div class="card" style="margin:6px 0"><b>${s[0]}</b> - ${s[1]} <button class="btn btn3" onclick="buy('${s[0]}')">BUY</button></div>`).join('')}
function buy(n){if(diamonds<100){alert('ডায়মন্ড কম');return}diamonds-=100;document.getElementById('diam').innerText=diamonds;save();alert(n+' কেনা হইছে ✅')}
function earnDiamond(v){diamonds+=v;document.getElementById('diam').innerText=diamonds;save();alert('+'+v+' 💎')}
function spin(){if(diamonds<50){alert('ডায়মন্ড শেষ');return}diamonds-=50;document.getElementById('diam').innerText=diamonds;save();document.getElementById('wheel').style.transform=`rotate(${360*5+Math.random()*360}deg)`;setTimeout(()=>{document.getElementById('spinMsg').innerText='🎉 পাইছো: '+['Jersey','Golden Ball','Boots','100 Coins'][Math.floor(Math.random()*4)]},2000)}
function openAdmin(){document.getElementById('adminModal').classList.add('open')}
function closeAdmin(){document.getElementById('adminModal').classList.remove('open')}
function adminLogin(){if(document.getElementById('adminPass').value===adminPass){document.getElementById('adminBody').style.display='block';alert('Admin খুলছে ✅')}else alert('ভুল Password')}
function addChar(){let n=document.getElementById('newCharName').value.trim();if(!n){alert('নাম দাও');return}chars.push([n,'⭐']);storeItems.push([n,'150 💎']);save();renderChars();renderStore();document.getElementById('adminMsg').innerText='✅ '+n+' Add হইছে! Store এ দেখো।';alert(n+' Add হইছে!')}
function changePass(){let np=document.getElementById('newPass').value;if(!np)return;adminPass=np;save();alert('Password Change হইছে!')}
renderChars();renderStore();

// GAME - FULL COURT FIT
let cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W,H,px,py,bx,by,vx=0,vy=0,scoreA=0,scoreB=0,playing=false,ballVX=0,ballVY=0,ballOwner='YOU',half=1,timeLeft=120,breakT=0,celebrate=0,goalCeleb=0,gkDiveB=0,netShake=0,kick=0;
let myP=[],oppP=[],crowd=[];
function startGame(){show('scr-home');document.getElementById('gameWrap').style.display='block';resize();scoreA=0;scoreB=0;half=1;timeLeft=120;breakT=0;celebrate=0;goalCeleb=0;playing=true;ballOwner='YOU';
myP=[];oppP=[];crowd=[];
for(let i=0;i<6;i++){myP.push({x:W*0.2+i*W*0.08,y:H*0.58+Math.random()*H*0.2});oppP.push({x:W*0.2+i*W*0.08,y:H*0.2+Math.random()*H*0.18})}
px=myP[5].x;py=myP[5].y;bx=px+18;by=py;
for(let i=0;i<100;i++){crowd.push({x:Math.random()*W,y:Math.random()*H*0.08,flag:['🇧🇩','🇧🇷','🇦🇷','🇫🇷','🇪🇸'][Math.floor(Math.random()*5)]})}
loop()}
function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight}
window.addEventListener('resize',()=>{if(playing)resize()});
function exitGame(){playing=false;document.getElementById('gameWrap').style.display='none';show('scr-home')}
function popup(t){let p=document.getElementById('popup');p.innerText=t;p.style.display='block';setTimeout(()=>p.style.display='none',1800)}
function loop(){if(!playing)return;requestAnimationFrame(loop);
if(breakT>0){breakT-=0.016;document.getElementById('score').innerText=`HALF TIME ${Math.ceil(breakT)}s • ${scoreA}-${scoreB}`;draw(true);if(breakT<=0){half=2;timeLeft=120;popup('⚽ 2ND HALF!')}return}
if(celebrate>0){celebrate-=0.016;draw(true);if(celebrate<=0){document.getElementById('gameWrap').style.display='none';show('scr-home')}return}
timeLeft-=0.016;if(goalCeleb>0)goalCeleb-=0.016;
let you=myP[5];you.x+=vx;you.y+=vy;you.x=Math.max(30,Math.min(W-30,you.x));you.y=Math.max(H*0.12,Math.min(H-30,you.y));px=you.x;py=you.y;
if(ballOwner==='YOU'){bx=px+18;by=py+6;ballVX=0;ballVY=0}
else if(ballOwner==='OPP'){let o=oppP[5];bx=o.x+16;by=o.y+6}
else if(ballOwner==='MATE'){let m=myP[2];bx=m.x+16;by=m.y+6}
else{bx+=ballVX;by+=ballVY;ballVX*=0.97;ballVY*=0.97}
myP.forEach((p,i)=>{if(i!==5){p.x+=(px-p.x)*0.003;p.y+=(py-p.y)*0.003;if(ballOwner===null&&Math.hypot(p.x-bx,p.y-by)<22){ballOwner='MATE';popup('✅ তোমার Player বল নিছে!')}}});
oppP.forEach((o,i)=>{if(i===0){o.x+=(bx-o.x)*0.06;o.y=H*0.14;return}let dx=bx-o.x,dy=by-o.y,d=Math.hypot(dx,dy)||1;o.x+=dx/d*0.9;o.y+=dy/d*0.9;if(d<24&&(ballOwner==='YOU'||ballOwner==='MATE')){ballOwner='OPP';popup('😤 Opponent কেড়ে নিছে!')}if(ballOwner==='OPP'&&i===5){o.y+=1;if(o.y>H*0.75&&Math.random()>0.99){if(Math.random()>0.45){scoreB++;netShake=1;goalCeleb=3;popup('⚽ OPP GOAL!');ballOwner=null;bx=W/2;by=H/2}else{gkDiveB=1;popup('🧤 তোমার GK SAVE!');ballOwner='YOU'}}}});
if(ballOwner==='OPP'&&Math.hypot(px-bx,py-by)<26){ballOwner='YOU';popup('✅ তুমি কেড়ে নিছো! SHOOT করো!')}
if(gkDiveB>0)gkDiveB-=0.02;if(netShake>0)netShake-=0.02;if(kick>0)kick-=0.04;
draw(false);
let mm=Math.floor(timeLeft/60),ss=Math.floor(timeLeft%60);document.getElementById('score').innerText=`${myTeam} ${scoreA} - ${scoreB} OPP • ${mm}:${String(ss).padStart(2,'0')} • ${half==1?'1ST':'2ND'} HALF`;
if(timeLeft<=0){if(half==1){breakT=10;popup('⏸️ HALF TIME 10s')}else{playing=false;celebrate=6;popup(scoreA>scoreB?'🏆 তুমি জিতছো! TROPHY!':scoreB>scoreA?'😔 হারছো!':'🤝 DRAW!');earnDiamond(100)}}
}
function player(x,y,color,name,you){ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,16,12,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(-8,8,7,10);ctx.fillRect(1,8,7,10);ctx.fillStyle='#000';ctx.fillRect(-9,18,8,4);ctx.fillRect(1,18,8,4);let fly=kick>0&&you?Math.sin(Date.now()/20)*4:0;ctx.fillStyle=color;ctx.fillRect(-11,-10+fly,22,20);ctx.fillStyle='#fff';ctx.fillRect(-11,-2+fly,22,3);ctx.fillStyle='#ffdbac';ctx.beginPath();ctx.arc(0,-14,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(0,-17,9,Math.PI,0);ctx.fill();if(you){ctx.fillStyle='#ffd700';ctx.fillRect(-12,-28,24,4)}ctx.fillStyle='#fff';ctx.font='bold 9px sans-serif';ctx.fillText(name,-12,34);ctx.restore()}
function goal(x,y,top){let s=netShake>0?Math.sin(Date.now()/25)*3:0;ctx.strokeStyle='#aaa';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x-70,y);ctx.lineTo(x-70,y+(top?26:-26));ctx.moveTo(x+70,y);ctx.lineTo(x+70,y+(top?26:-26));ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(x-70,y+(top?0:-26),140,26);ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(x-70+s,y+(top?0:-26),140,26)}
function draw(isBreak){ctx.fillStyle='#0a2a12';ctx.fillRect(0,0,W,H);ctx.fillStyle='#1a1a1a';ctx.fillRect(0,0,W,H*0.08);crowd.forEach(c=>{let w=(goalCeleb>0||celebrate>0)?Math.sin(Date.now()/80)*8:0;ctx.font='14px sans-serif';ctx.fillText('🧑',c.x,c.y+10);ctx.fillText(c.flag,c.x+16,c.y+10+w)});ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.fillText('🏟️ WORLD CUP • CROWD',W/2-70,H*0.04);ctx.fillStyle='#2e9e4f';ctx.fillRect(0,H*0.08,W,H*0.92);ctx.fillStyle='#37b35a';for(let i=0;i<5;i++){if(i%2==0)ctx.fillRect(0,H*0.08+i*H*0.184,W,H*0.184)}ctx.strokeStyle='rgba(255,255,255,.8)';ctx.strokeRect(20,H*0.1,W-40,H*0.88);ctx.beginPath();ctx.moveTo(20,H*0.54);ctx.lineTo(W-20,H*0.54);ctx.stroke();ctx.beginPath();ctx.arc(W/2,H*0.54,55,0,Math.PI*2);ctx.stroke();goal(W/2,H*0.1,true);goal(W/2,H*0.98,false);if(celebrate>0){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);ctx.font='70px sans-serif';ctx.fillText('🏆',W/2-35,H/2);ctx.fillStyle='#ffd700';ctx.font='bold 20px sans-serif';ctx.fillText(scoreA>scoreB?'🏆 CHAMPION! Trophy নিয়ে নাচতেছে!':'MATCH END',W/2-170,H/2+50);myP.forEach((p,i)=>{let jy=Math.sin(Date.now()/140+i)*14;player(p.x,H/2+80+jy,'#006a4e','🎉',false)});return}if(isBreak){ctx.fillStyle='#fff';ctx.font='bold 18px sans-serif';ctx.fillText('⏸️ HALF TIME',W/2-60,H/2);return}player(W/2+(gkDiveB>0?30:0),H*0.14,'#ff5722','GK',false);player(W/2,H*0.9,'#ffea00','GK',false);ctx.font='20px sans-serif';ctx.fillText('🧑‍🏫',20,H*0.5);ctx.fillText('📯',W-50,H*0.5);myP.forEach((p,i)=>{if(i!==0)player(p.x,p.y,'#006a4e',i==5?myChar:'BD',i==5)});oppP.forEach((o,i)=>{if(i!==0)player(o.x,o.y,'#c62828','OPP',false)});ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bx,by,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(bx-2,by-2,2,0,Math.PI*2);ctx.fill();if(goalCeleb>0){ctx.fillStyle='#ffd700';ctx.font='bold 16px sans-serif';ctx.fillText('🎉 GOAL! দর্শকরা উল্লাস!',W/2-110,H*0.4)}if(kick>0){ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.fillText('💥 POWER SHOOT!',px+20,py-30)}}
function doShoot(){if(ballOwner!=='YOU'&&ballOwner!=='MATE'){alert('আগে বল নাও!');return}kick=1;ballOwner=null;ballVX=0;ballVY=-14;setTimeout(()=>{if(Math.random()>0.42){scoreA++;netShake=1;goalCeleb=3;popup('⚽ GOAL! '+myChar+' 🔥');bx=W/2;by=H/2;ballOwner=null}else{gkDiveB=1;popup('🧤 GK শুয়ে SAVE!');ballOwner='OPP';bx=W/2;by=H*0.3}setTimeout(()=>{if(ballOwner===null){bx=px+18;by=py;ballOwner='YOU'}},1000)},500)}
function doPass(){if(ballOwner!=='YOU')return;ballOwner='MATE';popup('➡️ PASS!');setTimeout(()=>{ballOwner='YOU'},600)}
function doThrough(){if(ballOwner!=='YOU')return;ballOwner=null;ballVX=4;ballVY=-8;popup('↗️ THROUGH!');setTimeout(()=>{if(Math.hypot(bx-px,by-py)<80)ballOwner='YOU'},900)}
function doSprint(){vx*=1.9;vy*=1.9;setTimeout(()=>{vx/=1.9;vy/=1.9},800)}
let joy=document.getElementById('joy'),knob=document.getElementById('knob');
function joyMove(e){let r=joy.getBoundingClientRect();let cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left-55,cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top-55;cx=Math.max(-30,Math.min(30,cx));cy=Math.max(-30,Math.min(30,cy));knob.style.left=(30+cx)+'px';knob.style.top=(30+cy)+'px';vx=cx*0.18;vy=cy*0.18}
joy.addEventListener('touchmove',joyMove);joy.addEventListener('touchend',()=>{knob.style.left='30px';knob.style.top='30px';vx=0;vy=0});joy.addEventListener('mousemove',e=>{if(e.buttons)joyMove(e)})
</script></body></html>
