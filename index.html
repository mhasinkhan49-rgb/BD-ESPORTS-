<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>FC BD 27 - Fixed Smooth</title>
<style>
body{margin:0;background:#0a1a0a;color:#fff;font-family:Arial;overflow:hidden;touch-action:none}
.top-bar{background:#000;display:flex;justify-content:space-between;padding:8px 12px;border-bottom:2px solid #2ecc71}
.score-box{background:#111;padding:6px 14px;border-radius:6px;font-weight:bold}
#field{position:relative;width:100vw;height:calc(100vh - 135px);background:linear-gradient(#2f9d2f,#1e6b1e);overflow:hidden}
.player{position:absolute;width:30px;height:30px;border-radius:50%;text-align:center;line-height:30px;font-size:11px;font-weight:bold;border:2px solid #fff;will-change:transform}
.me{background:#e11;z-index:5} 
.me.active{background:#ff0;color:#000;border-color:#000;box-shadow:0 0 18px #fff,0 0 30px #ff0;transform:scale(1.5);z-index:20}
.opp{background:#3498db;opacity:0.9}
.ball{position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;border:2px solid #000;z-index:30;will-change:transform}
.goal{position:absolute;width:14px;height:120px;background:#fff;top:50%;transform:translateY(-50%)}
.goal.left{left:0} .goal.right{right:0}
.controls{position:fixed;bottom:0;width:100%;height:135px;background:#000e;display:flex;justify-content:space-between;padding:10px;box-sizing:border-box}
.joystick{width:110px;height:110px;background:rgba(255,255,255,0.12);border-radius:50%;position:relative;border:2px solid #fff5}
.stick{width:44px;height:44px;background:#fff;border-radius:50%;position:absolute;left:33px;top:33px;box-shadow:0 2px 8px #000}
.btns{display:flex;gap:10px;align-items:center}
.cbtn{width:62px;height:62px;border-radius:50%;background:#222;border:2px solid #fff;color:#fff;font-weight:bold;font-size:11px;display:flex;align-items:center;justify-content:center}
.cbtn:active{background:#fff;color:#000;transform:scale(0.95)}
#startScreen{position:absolute;inset:0;background:#000f;z-index:100;display:flex;align-items:center;justify-content:center}
.card{background:#122212;border:1px solid #2ecc71;border-radius:12px;padding:20px;width:90%;max-width:360px;text-align:center}
button.main{width:100%;padding:14px;background:#2ecc71;color:#000;border:none;border-radius:8px;font-weight:bold;font-size:16px}
</style>
</head>
<body>
<div class="top-bar">
<div class="score-box" id="score">BD 0 - 0 OPP</div>
<div class="score-box" id="timer">00:00</div>
</div>

<div id="field">
<div class="goal left"></div><div class="goal right"></div>
<div class="ball" id="ball"></div>
</div>

<div class="controls">
<div class="joystick" id="joy"><div class="stick" id="stick"></div></div>
<div class="btns">
<div class="cbtn" id="btnPass">PASS</div>
<div class="cbtn" id="btnShoot" style="border-color:#ff4444">SHOOT</div>
</div>
</div>

<div id="startScreen">
<div class="card">
<h2 style="color:#2ecc71;margin:0">FC BD 27 FIXED</h2>
<p style="font-size:13px;color:#aaa">নতুন System: শুধু তোমার ১ জন Player চলবে, বাকি সবাই Fixed দাঁড়িয়ে থাকবে। কোনো ল্যাগ/থেমে থেমে যাওয়া নেই।</p>
<button class="main" onclick="startGame()">KICK OFF</button>
</div>
</div>

<script>
const field=document.getElementById('field');
const ballEl=document.getElementById('ball');
let myPlayers=[], oppPlayers=[], activeIdx=9, ballOwner=null, ballV={x:0,y:0}, gameOn=false, scoreMe=0, scoreOpp=0, time=0;

function createPlayer(x,y,isMe,label){
 let el=document.createElement('div');
 el.className='player '+(isMe?'me':'opp');
 el.style.left=x+'px'; el.style.top=y+'px';
 el.innerText=label;
 field.appendChild(el);
 return {el,x,y,isMe,ox:x,oy:y}; // ox,oy = original position
}

function setup(){
 field.querySelectorAll('.player').forEach(e=>e.remove());
 myPlayers=[]; oppPlayers=[];
 let fw=field.clientWidth, fh=field.clientHeight;
 let myPos=[[60,fh/2,'GK'],[120,fh*0.2,'LB'],[120,fh*0.38,'CB'],[120,fh*0.62,'CB'],[120,fh*0.8,'RB'],[240,fh*0.3,'CM'],[240,fh*0.5,'CM'],[240,fh*0.7,'CM'],[380,fh*0.18,'LW'],[380,fh*0.5,'ST'],[380,fh*0.82,'RW']];
 let oppPos=[[fw-60,fh/2,'GK'],[fw-120,fh*0.2],[fw-120,fh*0.38],[fw-120,fh*0.62],[fw-120,fh*0.8],[fw-240,fh*0.3],[fw-240,fh*0.5],[fw-240,fh*0.7],[fw-380,fh*0.18],[fw-380,fh*0.5],[fw-380,fh*0.82]];

 myPos.forEach(p=>{let pl=createPlayer(p[0],p[1],true,p[2]); myPlayers.push(pl)});
 oppPos.forEach((p,i)=>{let pl=createPlayer(p[0],p[1],false,i==0?'GK':i); oppPlayers.push(pl)});

 setActive(9);
 let a=myPlayers[activeIdx];
 ballEl.style.left=a.x+22+'px'; ballEl.style.top=a.y+'px';
 ballOwner=a; ballV={x:0,y:0};
}

function setActive(i){
 myPlayers.forEach(p=>p.el.classList.remove('active'));
 myPlayers[i].el.classList.add('active');
 activeIdx=i;
}

let joy={dx:0,dy:0,active:false};
const joyEl=document.getElementById('joy'), stickEl=document.getElementById('stick');
joyEl.addEventListener('touchstart',e=>{joy.active=true; e.preventDefault()},{passive:false});
joyEl.addEventListener('touchmove',e=>{
 let r=joyEl.getBoundingClientRect(); let t=e.touches[0];
 let dx=t.clientX-(r.left+55), dy=t.clientY-(r.top+55);
 let dist=Math.min(45,Math.hypot(dx,dy)), ang=Math.atan2(dy,dx);
 joy.dx=Math.cos(ang)*dist/45; joy.dy=Math.sin(ang)*dist/45;
 stickEl.style.left=33+joy.dx*32+'px'; stickEl.style.top=33+joy.dy*32+'px';
 e.preventDefault();
},{passive:false});
joyEl.addEventListener('touchend',()=>{joy.active=false; joy.dx=0; joy.dy=0; stickEl.style.left='33px'; stickEl.style.top='33px'});

function findNearestTeammate(){
 let cur=myPlayers[activeIdx];
 let best=null, bestD=999;
 myPlayers.forEach((p,i)=>{
   if(i===activeIdx) return;
   let d=Math.hypot(p.x-cur.x,p.y-cur.y);
   if(d>40 && p.x>cur.x-50 && d<bestD){bestD=d; best=p}
 });
 return best;
}

function doPass(){
 if(!ballOwner||!ballOwner.isMe) return;
 let target=findNearestTeammate();
 if(!target) target=myPlayers[9];
 let ang=Math.atan2(target.y-ballEl.offsetTop, target.x-ballEl.offsetLeft);
 ballV.x=Math.cos(ang)*10; ballV.y=Math.sin(ang)*10;
 ballOwner=null;
}
function doShoot(){
 if(!ballOwner||!ballOwner.isMe) return;
 let goalY=field.clientHeight/2+(Math.random()-0.5)*50;
 let ang=Math.atan2(goalY-ballEl.offsetTop, field.clientWidth-ballEl.offsetLeft);
 ballV.x=Math.cos(ang)*15; ballV.y=Math.sin(ang)*15;
 ballOwner=null;
}

document.getElementById('btnPass').addEventListener('touchstart',doPass);
document.getElementById('btnShoot').addEventListener('touchstart',doShoot);

function gameLoop(){
 if(!gameOn) return;
 let active=myPlayers[activeIdx];
 // ONLY active player moves - FIXED!
 if(joy.active){
   active.x+=joy.dx*5.5;
   active.y+=joy.dy*5.5;
   active.x=Math.max(15,Math.min(field.clientWidth-35,active.x));
   active.y=Math.max(15,Math.min(field.clientHeight-35,active.y));
   active.el.style.left=active.x+'px';
   active.el.style.top=active.y+'px';
   if(ballOwner===active){
     ballEl.style.left=active.x+22+'px';
     ballEl.style.top=active.y+'px';
   }
 }
 // ball
 if(!ballOwner){
   ballEl.style.left=(ballEl.offsetLeft+ballV.x)+'px';
   ballEl.style.top=(ballEl.offsetTop+ballV.y)+'px';
   ballV.x*=0.982; ballV.y*=0.982;
   if(Math.abs(ballV.x)<0.1) ballV.x=0;
   if(Math.abs(ballV.y)<0.1) ballV.y=0;
   // pickup check - only teammates can pick if ball slow
   if(Math.hypot(ballV.x,ballV.y)<3){
     for(let p of myPlayers){
       if(Math.hypot(ballEl.offsetLeft-p.x, ballEl.offsetTop-p.y)<24){
         ballOwner=p; setActive(myPlayers.indexOf(p)); ballV={x:0,y:0}; break;
       }
     }
   }
   // goal
   let bx=ballEl.offsetLeft, by=ballEl.offsetTop;
   if(bx>field.clientWidth-18 && by>field.clientHeight/2-60 && by<field.clientHeight/2+60){
     scoreMe++; document.getElementById('score').innerText=`BD ${scoreMe} - ${scoreOpp} OPP`; alert('GOAL!!! ⚽'); setup(); return;
   }
   if(bx<0||bx>field.clientWidth||by<0||by>field.clientHeight){setup(); return;}
 }

 requestAnimationFrame(gameLoop);
}

function startGame(){
 document.getElementById('startScreen').style.display='none';
 setup(); gameOn=true;
 setInterval(()=>{if(!gameOn) return; time++; let m=String(Math.floor(time/60)).padStart(2,'0'); let s=String(time%60).padStart(2,'0'); document.getElementById('timer').innerText=m+':'+s},1000);
 gameLoop();
}
</script>
</body>
</html>
